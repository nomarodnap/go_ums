name: Build & Deploy to Production (GHCR & Coolify)

on:
  push:
    branches:
      - main
  workflow_dispatch: # อนุญาตให้กดสั่งรันแมนนวลได้จาก GitHub Actions UI

env:
  REGISTRY: ghcr.io
  COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}

jobs:
  # ========================================================
  # 1. Quality Gate: Lint, Vet, Typecheck & Tests
  # ========================================================
  quality-check:
    name: Test, Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Backend Checks (Go) ---
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: backend/go.sum

      - name: Backend - Static Analysis (go vet)
        working-directory: ./backend
        run: go vet ./...

      - name: Backend - Unit Tests (go test)
        working-directory: ./backend
        run: go test -v ./...

      # --- Frontend Checks (Next.js / TypeScript) ---
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend - Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Frontend - TypeScript Typecheck
        working-directory: ./frontend
        run: npm run typecheck

  # ========================================================
  # 2. Build & Push Docker Images to GHCR + Trigger Coolify
  # ========================================================
  build-and-push:
    name: Build Docker Images & Deploy
    needs: [quality-check] # ต้องผ่าน Test & Typecheck ก่อนเท่านั้น จึงจะเริ่ม build & deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # แปลงชื่อ Repository เป็นตัวพิมพ์เล็กสำหรับ Docker Tag มาตรฐาน GHCR
      - name: Convert repository name to lowercase
        id: repo_name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      # ----------------------------------------------------
      # 2.1 Build & Push Backend Image
      # ----------------------------------------------------
      - name: Build and push Go Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LC }}/backend:production
            ${{ env.REGISTRY }}/${{ env.REPO_LC }}/backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # ----------------------------------------------------
      # 2.2 Build & Push Frontend Image
      # ----------------------------------------------------
      - name: Build and push Next.js Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LC }}/frontend:production
            ${{ env.REGISTRY }}/${{ env.REPO_LC }}/frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      # ----------------------------------------------------
      # 2.3 Trigger Coolify Deployment Webhook
      # ----------------------------------------------------
      - name: Trigger Coolify Webhook
        if: env.COOLIFY_WEBHOOK_URL != ''
        run: |
          echo "Triggering Coolify deploy webhook..."
          curl -f -s -S -X POST "$COOLIFY_WEBHOOK_URL" || curl -f -s -S -X GET "$COOLIFY_WEBHOOK_URL"
          echo "Coolify deployment triggered successfully!"

      - name: Notify if Coolify Webhook is missing
        if: env.COOLIFY_WEBHOOK_URL == ''
        run: |
          echo "::warning ::COOLIFY_WEBHOOK_URL secret is not set. Docker images are pushed to GHCR, but Coolify was not triggered. Add COOLIFY_WEBHOOK_URL to GitHub Secrets to automate deployments."
