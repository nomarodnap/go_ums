name: Build & Deploy to Production (GHCR & Coolify)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # อนุญาตให้กดสั่งรันแมนนวลได้จาก GitHub Actions UI

env:
  REGISTRY: ghcr.io
  COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}

jobs:
  # ========================================================
  # 1. Quality Gate: Lint, Vet, Typecheck & Tests
  # ========================================================
  quality-check:
    name: Test, Lint & Typecheck
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # --- Backend Checks (Go) ---
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go.sum

      - name: Backend - Static Analysis (go vet)
        working-directory: ./backend
        run: go vet ./...

      - name: Backend - GolangCI-Lint
        uses: golangci/golangci-lint-action@v9
        continue-on-error: true
        with:
          version: latest
          working-directory: ./backend
          args: --timeout=5m --issues-exit-code=0

      - name: Backend - Unit Tests & Concurrency Race Check
        working-directory: ./backend
        run: go test -v -race ./...

      # --- Frontend Checks (Next.js / TypeScript) ---
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend - Install Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Frontend - TypeScript Typecheck
        working-directory: ./frontend
        run: npm run typecheck

      - name: Frontend - Pre-flight Next.js Build
        working-directory: ./frontend
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

  # ========================================================
  # 2. Build & Push Docker Images to GHCR + Trigger Coolify
  # ========================================================
  build-and-push:
    name: Build Docker Images & Deploy
    needs: [quality-check] # ต้องผ่าน Test & Typecheck ก่อนเท่านั้น จึงจะเริ่ม build & deploy
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # แปลงชื่อ Repository เป็นตัวพิมพ์เล็กสำหรับ Docker Tag มาตรฐาน GHCR
      - name: Convert repository name to lowercase
        id: repo_name
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      # ----------------------------------------------------
      # 2.1 Build & Push Backend Image
      # ----------------------------------------------------
      - name: Build and push Go Backend Image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LC }}/backend:production
            ${{ env.REGISTRY }}/${{ env.REPO_LC }}/backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # ----------------------------------------------------
      # 2.2 Build & Push Frontend Image
      # ----------------------------------------------------
      - name: Build and push Next.js Frontend Image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO_LC }}/frontend:production
            ${{ env.REGISTRY }}/${{ env.REPO_LC }}/frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # ========================================================
  # 3. Deploy to Server via Self-Hosted Runner
  # ========================================================
  deploy:
    name: Deploy to Server via Coolify
    needs: [build-and-push]
    runs-on: self-hosted
    steps:
      - name: Trigger Coolify Deployment
        run: |
          echo "Triggering Coolify deployment locally on server..."
          docker exec coolify php artisan tinker --execute='
          $app = App\Models\Application::where("uuid", "xg9mjo2uni7wny0q8ee0itki")->first();
          if ($app) {
              $result = queue_application_deployment(
                  application: $app,
                  deployment_uuid: new_public_id(),
                  force_rebuild: false,
              );
              echo "Coolify deployment result: " . json_encode($result) . "\n";
          } else {
              echo "Error: Application not found in Coolify!\n";
              exit(1);
          }
          '
          echo "Coolify deployment triggered successfully!"
