version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - misspell
  settings:
    errcheck:
      check-blank: false
      exclude-functions:
        - (*io.Closer).Close
        - (io.Closer).Close
        - (*net.Conn).Close
        - (*os.File).Close
  exclusions:
    paths:
      - internal/db/
    rules:
      - path: _test\.go
        linters:
          - errcheck
