version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ums_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: new_ums
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ums_backend
    restart: always
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://postgres:password123@postgres:5432/new_ums?sslmode=disable"
      REDIS_URL: "redis://:qBte3j7A4S1p0y4hRNev5AkO@192.168.171.97:6379"
      JWT_SECRET: "fisheries-super-secret-jwt-key-2026-very-secure"
      CORS_ORIGIN: "http://localhost:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ums_frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: "http://backend:8080"
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:

