version: '3.8'

services:
  # ========================================================
  # Frontend: Next.js Web Application
  # ========================================================
  frontend:
    image: ghcr.io/nomarodnap/go_ums/frontend:production
    container_name: ums_frontend
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      # Internal URL สำหรับ Next.js Server Components / Actions ติดต่อ Go Backend ภายใน Docker
      - INTERNAL_API_URL=http://backend:8080
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
      - BETTER_AUTH_URL=http://192.168.171.97:10000
      - BETTER_AUTH_SECRET=${JWT_SECRET}
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL:-${DATABASE_URL}}
    volumes:
      # เก็บไฟล์เอกสาร/ใบเสร็จที่อัปโหลดไม่ให้หายเมื่อมีการอัปเดต Image ใหม่
      - ums_uploads:/app/public/uploads
    depends_on:
      - backend
    networks:
      - coolify
      - ums_network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      # 1. Better Auth (Next.js API route handlers) - Priority 100
      - "traefik.http.routers.ums-auth.rule=PathPrefix(`/api/auth`)"
      - "traefik.http.routers.ums-auth.entrypoints=port10000,http"
      - "traefik.http.routers.ums-auth.priority=100"
      - "traefik.http.routers.ums-auth.service=ums-frontend-svc"
      # 2. Web UI Application - Priority 10
      - "traefik.http.routers.ums-frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.ums-frontend.entrypoints=port10000,http"
      - "traefik.http.routers.ums-frontend.priority=10"
      - "traefik.http.routers.ums-frontend.service=ums-frontend-svc"
      # Service definition
      - "traefik.http.services.ums-frontend-svc.loadbalancer.server.port=3000"

  # ========================================================
  # Backend: Go REST API & River Background Worker
  # ========================================================
  backend:
    image: ghcr.io/nomarodnap/go_ums/backend:production
    container_name: ums_backend
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      - PORT=8080
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL:-${DATABASE_URL}}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - APP_URL=${APP_URL:-http://localhost}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-ระบบรายงานค่าสาธารณูปโภค กรมประมง}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL}
      - UPLOAD_DIR=/app/uploads
    volumes:
      - ums_uploads:/app/uploads
    networks:
      - coolify
      - ums_network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      # 1. Go REST API & SSE Events Hub - Priority 50
      - "traefik.http.routers.ums-api.rule=PathPrefix(`/api`)"
      - "traefik.http.routers.ums-api.entrypoints=port10000,http"
      - "traefik.http.routers.ums-api.priority=50"
      - "traefik.http.routers.ums-api.service=ums-backend-svc"
      # 2. File Uploads - Priority 50
      - "traefik.http.routers.ums-uploads.rule=PathPrefix(`/uploads`)"
      - "traefik.http.routers.ums-uploads.entrypoints=port10000,http"
      - "traefik.http.routers.ums-uploads.priority=50"
      - "traefik.http.routers.ums-uploads.service=ums-backend-svc"
      # Service definition
      - "traefik.http.services.ums-backend-svc.loadbalancer.server.port=8080"

volumes:
  ums_uploads:
    name: ums_uploads

networks:
  coolify:
    external: true
  ums_network:
    name: ums_network
