version: '3.8'

services:
  # ========================================================
  # Frontend: Next.js Web Application
  # ========================================================
  frontend:
    image: ghcr.io/nomarodnap/go_ums/frontend:production
    container_name: ums_frontend
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      # Internal URL สำหรับ Next.js Server Components / Actions ติดต่อ Go Backend ภายใน Docker
      - INTERNAL_API_URL=http://backend:8080
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://ums.fisheries.go.th}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL:-https://ums.fisheries.go.th}
      - BETTER_AUTH_SECRET=${JWT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - LINE_CLIENT_ID=${LINE_CLIENT_ID:-}
      - LINE_CLIENT_SECRET=${LINE_CLIENT_SECRET:-}
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL:-${DATABASE_URL}}
    volumes:
      # เก็บไฟล์เอกสาร/ใบเสร็จที่อัปโหลดไม่ให้หายเมื่อมีการอัปเดต Image ใหม่
      - ums_uploads:/app/public/uploads
    depends_on:
      - backend
    networks:
      - coolify
      - ums_network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      # 1. Better Auth (Next.js API route handlers) - Priority 100
      - "traefik.http.routers.ums-auth-https.rule=Host(`ums.fisheries.go.th`) && PathPrefix(`/api/auth`)"
      - "traefik.http.routers.ums-auth-https.entrypoints=https"
      - "traefik.http.routers.ums-auth-https.priority=100"
      - "traefik.http.routers.ums-auth-https.tls=true"
      - "traefik.http.routers.ums-auth-https.service=ums-frontend-svc"
      - "traefik.http.routers.ums-auth-http.rule=Host(`ums.fisheries.go.th`) && PathPrefix(`/api/auth`)"
      - "traefik.http.routers.ums-auth-http.entrypoints=http"
      - "traefik.http.routers.ums-auth-http.priority=100"
      - "traefik.http.routers.ums-auth-http.service=ums-frontend-svc"
      - "traefik.http.routers.ums-auth-p10000.rule=PathPrefix(`/api/auth`)"
      - "traefik.http.routers.ums-auth-p10000.entrypoints=port10000"
      - "traefik.http.routers.ums-auth-p10000.priority=100"
      - "traefik.http.routers.ums-auth-p10000.service=ums-frontend-svc"
      # 2. Web UI Application - Priority 10
      - "traefik.http.routers.ums-frontend-https.rule=Host(`ums.fisheries.go.th`)"
      - "traefik.http.routers.ums-frontend-https.entrypoints=https"
      - "traefik.http.routers.ums-frontend-https.priority=10"
      - "traefik.http.routers.ums-frontend-https.tls=true"
      - "traefik.http.routers.ums-frontend-https.service=ums-frontend-svc"
      - "traefik.http.routers.ums-frontend-http.rule=Host(`ums.fisheries.go.th`)"
      - "traefik.http.routers.ums-frontend-http.entrypoints=http"
      - "traefik.http.routers.ums-frontend-http.priority=10"
      - "traefik.http.routers.ums-frontend-http.service=ums-frontend-svc"
      - "traefik.http.routers.ums-frontend-p10000.rule=PathPrefix(`/`)"
      - "traefik.http.routers.ums-frontend-p10000.entrypoints=port10000"
      - "traefik.http.routers.ums-frontend-p10000.priority=10"
      - "traefik.http.routers.ums-frontend-p10000.service=ums-frontend-svc"
      # Service definition
      - "traefik.http.services.ums-frontend-svc.loadbalancer.server.port=3000"

  # ========================================================
  # Backend: Go REST API & River Background Worker
  # ========================================================
  backend:
    image: ghcr.io/nomarodnap/go_ums/backend:production
    container_name: ums_backend
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      - PORT=8080
      - DATABASE_URL=${DATABASE_URL}
      - DIRECT_URL=${DIRECT_URL:-${DATABASE_URL}}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - APP_URL=${APP_URL:-https://ums.fisheries.go.th}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-ระบบรายงานค่าสาธารณูปโภค กรมประมง}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL}
      - UPLOAD_DIR=/app/uploads
      - GARAGE_ENDPOINT=${GARAGE_ENDPOINT:-}
      - GARAGE_ACCESS_KEY=${GARAGE_ACCESS_KEY:-}
      - GARAGE_SECRET_KEY=${GARAGE_SECRET_KEY:-}
      - GARAGE_REGION=${GARAGE_REGION:-garage}
      - GARAGE_USE_SSL=${GARAGE_USE_SSL:-false}
      - GARAGE_BUCKET=${GARAGE_BUCKET:-ums-uploads}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
      - LINE_MESSAGING_CHANNEL_ACCESS_TOKEN=${LINE_MESSAGING_CHANNEL_ACCESS_TOKEN:-}
      - LINE_MESSAGING_CHANNEL_SECRET=${LINE_MESSAGING_CHANNEL_SECRET:-}
    volumes:
      - ums_uploads:/app/uploads
    networks:
      - coolify
      - ums_network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      # Go REST API, SSE (/api/events), File Uploads, Docs & Health - Priority 50
      - "traefik.http.routers.ums-backend-https.rule=Host(`ums.fisheries.go.th`) && (PathPrefix(`/api`) || PathPrefix(`/uploads`) || PathPrefix(`/docs`) || PathPrefix(`/openapi.json`) || PathPrefix(`/health`))"
      - "traefik.http.routers.ums-backend-https.entrypoints=https"
      - "traefik.http.routers.ums-backend-https.priority=50"
      - "traefik.http.routers.ums-backend-https.tls=true"
      - "traefik.http.routers.ums-backend-https.service=ums-backend-svc"
      - "traefik.http.routers.ums-backend-http.rule=Host(`ums.fisheries.go.th`) && (PathPrefix(`/api`) || PathPrefix(`/uploads`) || PathPrefix(`/docs`) || PathPrefix(`/openapi.json`) || PathPrefix(`/health`))"
      - "traefik.http.routers.ums-backend-http.entrypoints=http"
      - "traefik.http.routers.ums-backend-http.priority=50"
      - "traefik.http.routers.ums-backend-http.service=ums-backend-svc"
      - "traefik.http.routers.ums-backend-p10000.rule=PathPrefix(`/api`) || PathPrefix(`/uploads`) || PathPrefix(`/docs`) || PathPrefix(`/openapi.json`) || PathPrefix(`/health`)"
      - "traefik.http.routers.ums-backend-p10000.entrypoints=port10000"
      - "traefik.http.routers.ums-backend-p10000.priority=50"
      - "traefik.http.routers.ums-backend-p10000.service=ums-backend-svc"
      # Service definition
      - "traefik.http.services.ums-backend-svc.loadbalancer.server.port=8080"

volumes:
  ums_uploads:
    name: ums_uploads

networks:
  coolify:
    external: true
  ums_network:
    name: ums_network
