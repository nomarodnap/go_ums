version: '3.8'

services:
  # ========================================================
  # Nginx Reverse Proxy (Unified Gateway)
  # ========================================================
  nginx:
    image: nginx:alpine
    container_name: ums_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ums_uploads:/var/www/uploads:ro
    depends_on:
      - frontend
      - backend
    networks:
      - ums_network

  # ========================================================
  # Frontend: Next.js Web Application
  # ========================================================
  frontend:
    image: ghcr.io/nomarodnap/go_ums/frontend:production
    container_name: ums_frontend
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
      # Internal URL สำหรับ Next.js Server Components / Actions ติดต่อ Go Backend ภายใน Docker
      - INTERNAL_API_URL=http://backend:8080
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
    volumes:
      # เก็บไฟล์เอกสาร/ใบเสร็จที่อัปโหลดไม่ให้หายเมื่อมีการอัปเดต Image ใหม่
      - ums_uploads:/app/public/uploads
    depends_on:
      - backend
    networks:
      - ums_network

  # ========================================================
  # Backend: Go REST API & Asynq Background Worker
  # ========================================================
  backend:
    image: ghcr.io/nomarodnap/go_ums/backend:production
    container_name: ums_backend
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      - PORT=8080
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - JWT_SECRET=${JWT_SECRET}
      - CORS_ORIGIN=${CORS_ORIGIN:-*}
      - APP_URL=${APP_URL:-http://localhost}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM_NAME=${SMTP_FROM_NAME:-ระบบรายงานค่าสาธารณูปโภค กรมประมง}
      - SMTP_FROM_EMAIL=${SMTP_FROM_EMAIL}
    depends_on:
      - redis
    networks:
      - ums_network

  # ========================================================
  # Redis: Asynq Queue & In-Memory Cache
  # ========================================================
  redis:
    image: redis:7-alpine
    container_name: ums_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - ums_network

  # ========================================================
  # PostgreSQL 16 (เปิดใช้เมื่อต้องการ Database ภายใน VPS ตัวเอง)
  # ถ้าใช้ Cloud DB เช่น Supabase ให้ Comment ส่วนนี้ออกได้
  # ========================================================
  postgres:
    image: postgres:16-alpine
    container_name: ums_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      POSTGRES_DB: ${POSTGRES_DB:-new_ums}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - ums_network

volumes:
  ums_uploads:
    name: ums_uploads
  redis_data:
    name: ums_redis_data
  pgdata:
    name: ums_pgdata

networks:
  ums_network:
    name: ums_network
